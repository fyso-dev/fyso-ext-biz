description: Connect to Fyso Biz, download teams, sync this project's departments and propose their changes
working_dir: ${FYSO_ROOT}
max_active_runs: 1
params:
  - FYSO_BIZ_OP: status
  - FYSO_BIZ_TEAM: ""
  - FYSO_BIZ_LOCAL_DEPARTMENT: ""
  - FYSO_BIZ_OVERWRITE: ""
  - FYSO_BIZ_MESSAGE: ""
steps:
  - id: team
    command: framework/scripts/run-ext.sh biz -- node extensions/biz/biz.cjs panel
    output: RESULT
