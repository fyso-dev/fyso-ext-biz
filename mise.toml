[tools]
node = "24.15.0"
"aqua:astral-sh/uv" = "0.5.1"
# Same pin as the framework: team.cjs reads the team file through the yaml CLI's library.
"npm:yaml" = "2.8.1"

[tasks.test]
run = "node --require ./tests/isolation-preload.cjs --test tests/*.test.cjs"

[tasks.contract]
description = "Tier 2: fake Biz scenarios against a real local Biz (needs BIZ_CONTRACT_URL; skips without it)"
run = "node --test \"tests/contract/*.contract.cjs\""

[tasks.coverage]
run = "node scripts/check-coverage.cjs"

[tasks.build]
run = "node scripts/build.cjs"

[tasks.test-panel]
run = "npm run test:panel"
