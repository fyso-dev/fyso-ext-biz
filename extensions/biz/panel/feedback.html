<!doctype html>
<html lang="es">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fyso</title>
<link rel="stylesheet" href="./feedback.css">
<main>
  <h1 id="heading"></h1>
  <form id="load">
    <label><span id="report-label"></span><input id="report-path" required></label>
    <button id="load-button"></button>
  </form>
  <form id="send" hidden>
    <label><span id="title-label"></span><input id="title" required maxlength="200"></label>
    <label><span id="body-label"></span><textarea id="body" required maxlength="16500" rows="12"></textarea></label>
    <label><span id="related-label"></span><input id="related"></label>
    <p id="review"></p>
    <button id="send-button"></button>
  </form>
  <p id="status" role="status"></p>
  <a id="issue" hidden target="_blank" rel="noopener noreferrer"></a>
</main>
<script type="module" src="./feedback.js"></script>
</html>
