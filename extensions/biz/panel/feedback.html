<!doctype html>
<html lang="es">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fyso</title>
<link rel="stylesheet" href="./feedback.css">
<main>
  <h1 id="heading">Reportar a Fyso</h1>
  <form id="load">
    <label for="report-path"><span id="report-label">Ruta o ID del reporte local</span><input id="report-path" required></label>
    <button id="load-button"></button>
  </form>
  <form id="send" hidden>
    <p><span id="loaded-label"></span> <strong id="loaded-id"></strong></p>
    <label for="title"><span id="title-label">Título</span><input id="title" required maxlength="200"></label>
    <label for="body"><span id="body-label">Contenido para GitHub</span><textarea id="body" required maxlength="16500" rows="12"></textarea></label>
    <label for="related"><span id="related-label">Ruta o ID del reporte original (opcional)</span><input id="related"></label>
    <p id="review"></p>
    <button id="send-button"></button>
  </form>
  <p><output id="status"></output></p>
  <a id="issue" hidden target="_blank" rel="noopener noreferrer">Ver en GitHub</a>
</main>
<script type="module" src="./feedback.js"></script>
</html>
